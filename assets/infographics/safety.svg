<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-label="Built so you can experiment safely: undo, panic button, local-first, delete equals gone">
  <rect width="1120" height="400" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="64" font-size="32" font-weight="700" fill="#f1f5f9">Built so you can experiment safely</text>
    <rect x="56" y="78" width="64" height="4" fill="#22d3ee"/>

    <g>
      <rect x="56" y="110" width="234" height="210" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="56" y="110" width="234" height="5" rx="2" fill="#34d399"/>
      <text x="80" y="152" font-size="17" font-weight="700" fill="#f1f5f9">One-click undo</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="80" y="184">Every block is one click</text>
        <text x="80" y="208">to reverse — and the app</text>
        <text x="80" y="232">shows exactly what it</text>
        <text x="80" y="256">changed.</text>
      </g>
    </g>

    <g>
      <rect x="306" y="110" width="234" height="210" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="306" y="110" width="234" height="5" rx="2" fill="#f87171"/>
      <text x="330" y="152" font-size="17" font-weight="700" fill="#f1f5f9">Restore Internet</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="330" y="184">A panic button in the</text>
        <text x="330" y="208">corner undoes every block</text>
        <text x="330" y="232">the app ever made, in one</text>
        <text x="330" y="256">click. Breathe.</text>
      </g>
    </g>

    <g>
      <rect x="556" y="110" width="234" height="210" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="556" y="110" width="234" height="5" rx="2" fill="#22d3ee"/>
      <text x="580" y="152" font-size="17" font-weight="700" fill="#f1f5f9">Local-first</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="580" y="184">Nothing leaves your PC by</text>
        <text x="580" y="208">default. The one optional</text>
        <text x="580" y="232">extra — an anonymous</text>
        <text x="580" y="256">count — is off unless you</text>
        <text x="580" y="280">say yes.</text>
      </g>
    </g>

    <g>
      <rect x="806" y="110" width="234" height="210" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="806" y="110" width="234" height="5" rx="2" fill="#a78bfa"/>
      <text x="830" y="152" font-size="17" font-weight="700" fill="#f1f5f9">Delete = gone</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="830" y="184">No installer, no services</text>
        <text x="830" y="208">left behind, no account,</text>
        <text x="830" y="232">no subscription. Remove</text>
        <text x="830" y="256">the folder and it is gone.</text>
      </g>
    </g>

    <text x="1064" y="376" font-size="13" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
