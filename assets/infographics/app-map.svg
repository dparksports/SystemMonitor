<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-label="Where everything lives: Watch, Contain, System">
  <rect width="1120" height="660" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="64" font-size="32" font-weight="700" fill="#f1f5f9">Where everything lives</text>
    <rect x="56" y="78" width="64" height="4" fill="#22d3ee"/>

    <rect x="56" y="110" width="264" height="470" rx="12" fill="#0b1220" stroke="#334155"/>
    <g font-size="13" font-weight="700" fill="#22d3ee">
      <text x="80" y="140">WATCH</text>
      <text x="80" y="290" fill="#f87171">CONTAIN</text>
      <text x="80" y="414" fill="#a78bfa">SYSTEM</text>
    </g>
    <g font-size="14" fill="#e2e8f0">
      <rect x="64" y="158" width="6" height="6" fill="#22d3ee"/><text x="80" y="166">Connections</text>
      <rect x="64" y="184" width="6" height="6" fill="#22d3ee"/><text x="80" y="192">Spawns</text>
      <rect x="64" y="210" width="6" height="6" fill="#22d3ee"/><text x="80" y="218">Process monitor</text>
      <rect x="64" y="236" width="6" height="6" fill="#22d3ee"/><text x="80" y="244">Why is this site slow?</text>
      <rect x="64" y="308" width="6" height="6" fill="#f87171"/><text x="80" y="316">Firewall</text>
      <rect x="64" y="334" width="6" height="6" fill="#f87171"/><text x="80" y="342">Telemetry sinkholes</text>
      <rect x="64" y="360" width="6" height="6" fill="#f87171"/><text x="80" y="368">Defender</text>
      <rect x="64" y="432" width="6" height="6" fill="#a78bfa"/><text x="80" y="440">Be My Guest</text>
      <rect x="64" y="458" width="6" height="6" fill="#a78bfa"/><text x="80" y="466">Privacy</text>
      <rect x="64" y="484" width="6" height="6" fill="#a78bfa"/><text x="80" y="492">Shields Up</text>
      <rect x="64" y="510" width="6" height="6" fill="#a78bfa"/><text x="80" y="518">Investigate</text>
    </g>

    <g>
      <rect x="352" y="110" width="712" height="142" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="384" y="144" font-size="18" font-weight="700" fill="#22d3ee">Watch — everything that shows what is happening</text>
      <g font-size="14.5" fill="#cbd5e1">
        <text x="384" y="176">· Connections — every program talking to the internet, right now</text>
        <text x="384" y="201">· Spawns — one tab for who launched this: tasks, scripts, the svchost timeline</text>
        <text x="384" y="226">· Process monitor with matrix-rain replay · a 60-second site-slowness check</text>
      </g>
    </g>

    <g>
      <rect x="352" y="268" width="712" height="142" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="384" y="302" font-size="18" font-weight="700" fill="#f87171">Contain — the stopping tools</text>
      <g font-size="14.5" fill="#cbd5e1">
        <text x="384" y="334">· Firewall profiles, presets, and a drift enforcer that reverts silent changes</text>
        <text x="384" y="359">· Telemetry sinkholes and Defender controls</text>
        <text x="384" y="384">· Every block reversible — a panic button restores the whole internet</text>
      </g>
    </g>

    <g>
      <rect x="352" y="426" width="712" height="142" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="384" y="460" font-size="18" font-weight="700" fill="#a78bfa">System — the rest</text>
      <g font-size="14.5" fill="#cbd5e1">
        <text x="384" y="492">· Be My Guest — your AI assistant reads the same facts; open only while you allow</text>
        <text x="384" y="517">· Privacy and settings · Shields Up rituals: Quick Scan, Doors, Privacy, Junk, Hardening</text>
        <text x="384" y="542">· Investigate — one process, all the evidence, one verdict (behind the Advanced toggle)</text>
      </g>
    </g>

    <text x="1064" y="644" font-size="13" fill="#64748b" text-anchor="end">AutoCommand · dparksports/autocommand</text>
  </g>
</svg>
